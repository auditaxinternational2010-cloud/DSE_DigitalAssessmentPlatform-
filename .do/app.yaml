name: eya-questionnaire

services:
  - name: web
    github:
      repo: YOUR_GITHUB_USERNAME/eya_questionnaire   # set to the real repo before wiring deploy_on_push
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 2              # >=2 for zero-downtime deploys and burst headroom
    instance_size_slug: basic-s    # >=1 GB RAM; basic-xxs (512 MB) is too small for 3 workers + PDF
    health_check:
      http_path: /login/
    envs:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        value: "REPLACE_WITH_YOUR_SECRET_KEY"
        type: SECRET
      - key: ALLOWED_HOSTS
        value: "eya-dpa.auditaxinternational.co.tz"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://eya-dpa.auditaxinternational.co.tz"
      - key: SITE_URL
        value: "https://eya-dpa.auditaxinternational.co.tz"
      # Database
      - key: DB_NAME
        value: ${db.DATABASE}
      - key: DB_USER
        value: ${db.USERNAME}
      - key: DB_PASSWORD
        value: ${db.PASSWORD}
        type: SECRET
      - key: DB_HOST
        value: ${db.HOSTNAME}
      - key: DB_PORT
        value: ${db.PORT}
      # Shared cache for rate limiting — point at a separately-provisioned managed Redis/Valkey
      - key: REDIS_URL
        value: "REPLACE_WITH_YOUR_REDIS_CONNECTION_STRING"
        type: SECRET
      # Object storage (S3)
      - key: DEFAULT_FILE_STORAGE
        value: "storages.backends.s3boto3.S3Boto3Storage"
      - key: AWS_STORAGE_BUCKET_NAME
        value: "REPLACE_WITH_YOUR_BUCKET_NAME"
      - key: AWS_S3_REGION_NAME
        value: "REPLACE_WITH_YOUR_REGION"   # MUST match the bucket's real region
      - key: AWS_ACCESS_KEY_ID
        value: "REPLACE_WITH_YOUR_KEY_ID"
        type: SECRET
      - key: AWS_SECRET_ACCESS_KEY
        value: "REPLACE_WITH_YOUR_SECRET"
        type: SECRET
      # Evidence upload limits. Omit these entirely to fall back to the defaults
      # in settings.py (5 MB per file / 5 files per criterion / 100 MB per org).
      # Values are bytes. Raising them is safe: usage is recomputed live as a
      # SUM over EvidenceDocument.file_size, so there is no stored counter and
      # no migration — existing documents and S3 objects are untouched.
      # NOTE: EVIDENCE_MAX_QUOTA_BYTES is per organization and cumulative across
      # every cycle; it does not reset when a new cycle opens.
      - key: EVIDENCE_MAX_FILE_BYTES
        value: "20971520"      # 20 MB per file
      - key: EVIDENCE_MAX_FILES_PER_RESP
        value: "5"             # files per criterion
      - key: EVIDENCE_MAX_QUOTA_BYTES
        value: "524288000"     # 500 MB per organization
      # Email (cPanel SMTP)
      - key: EMAIL_HOST
        value: "mail.auditaxinternational.co.tz"
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_USE_SSL
        value: "True"
      - key: EMAIL_HOST_USER
        value: "REPLACE_WITH_SENDING_MAILBOX"
      - key: EMAIL_HOST_PASSWORD
        value: "REPLACE_WITH_MAILBOX_PASSWORD"
        type: SECRET
      - key: DEFAULT_FROM_EMAIL
        value: "EYA Platform <noreply@auditaxinternational.co.tz>"

databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-1vcpu-1gb   # production tier — NOT db-s-dev-database
    num_nodes: 1
