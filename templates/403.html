{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied — DSE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/eya.css' %}">
</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;background:var(--bg);">
  <div style="display:flex;align-items:center;justify-content:space-between;width:100%;max-width:480px;margin-bottom:48px;">
    <a href="https://auditaxinternational.co.tz/" target="_blank" rel="noopener noreferrer">
      <img src="{% static 'auditax.png' %}" alt="Auditax International" style="height:56px;width:auto;">
    </a>
    <img src="{% static 'dse_logo.png' %}" alt="EYA" style="height:56px;width:auto;">
  </div>
  <div style="max-width:480px;width:100%;text-align:center;">
    <div style="font-family:var(--font-display,inherit);font-size:80px;font-weight:700;color:var(--navy);line-height:1;margin-bottom:16px;">403</div>
    <h1 style="font-size:22px;font-weight:600;color:var(--navy);margin-bottom:10px;">Access Denied</h1>
    <p style="font-size:14px;color:var(--ink-3);line-height:1.6;margin-bottom:32px;">You don't have permission to view this page. If you believe this is an error, contact your administrator.</p>
    <a href="/" class="btn btn-primary">Go to Dashboard</a>
  </div>
</div>
</body>
</html>
